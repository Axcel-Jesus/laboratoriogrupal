<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema Académico</title>
    <link rel="stylesheet" href="css/styles.css"> 
</head>
<body>
    <main class="container">
        <div class="card">
            <h1>Crear cuenta</h1>
            <p class="subtitle">Regístrate para acceder al sistema</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="nombres">Nombres</label>
                    <input type="text" id="nombres" name="nombres" required placeholder="Ingrese sus nombres">
                </div>
                
                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required placeholder="Ingrese sus apellidos">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="alumno@universidad.edu.pe">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
                </div>

                <button type="submit">Registrarse</button>
                <div class="link" style="text-align: center; margin-top: 15px;">
                    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
                </div>

            </form>
            
            <p id="message"></p>
        </div>
    </main>
    <script src="js/register.js"></script>
</body>
</html>
