<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro & To-Do | Avance Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); min-height: 100vh; padding-bottom: 50px; color: #334e68; }
        header { background-color: #1e3a8a; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 40px; }
        header h1 { font-size: 1.5rem; font-weight: 600; }
        #btnLogout { background-color: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.3s; width: auto; }
        #btnLogout:hover { background-color: #dc2626; }
        .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 30px; padding: 0 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } }
        .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); display: flex; flex-direction: column; }
        .card h2 { font-size: 1.2rem; color: #1e3a8a; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .pomodoro-card { background: linear-gradient(180deg, #ffffff 0%, #eff6ff 100%); align-items: center; justify-content: center; text-align: center; }
        #timer { font-size: 5rem; font-weight: 700; color: #2563eb; margin: 20px 0; text-shadow: 2px 2px 4px rgba(37,99,235,0.2); letter-spacing: 2px; }
        #btnStart { background-color: #2563eb; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.1rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.4); transition: transform 0.2s, background 0.3s; width: auto; }
        #btnStart:hover { background-color: #1d4ed8; transform: translateY(-2px); }
        #btnStart:active { transform: translateY(1px); }
        .formulario-tarea { display: flex; gap: 10px; margin-bottom: 25px; }
        .formulario-tarea input { flex: 1; padding: 15px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color 0.3s; width: 100%; }
        .formulario-tarea input:focus { border-color: #3b82f6; }
        .formulario-tarea button { background-color: #10b981; color: white; border: none; padding: 0 25px; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.3s; width: auto; }
        .formulario-tarea button:hover { background-color: #059669; }
        #listaTareas { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .tarea-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 15px; border-radius: 10px; border-left: 5px solid #3b82f6; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: all 0.3s; }
        .tarea-item:hover { transform: translateX(5px); }
        .tarea-item span { font-weight: 500; color: #1e293b; flex: 1; margin-right: 10px; }
        .tarea-item span.completada { text-decoration: line-through; color: #94a3b8; border-left-color: #10b981; }
        .btn-accion { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: white; transition: opacity 0.2s; width: auto; }
        .btn-accion:hover { opacity: 0.8; }
        .btn-completar { background-color: #10b981; }
        .btn-eliminar { background-color: #ef4444; margin-left: 8px; }
        #listaTareas p { text-align: center; color: #64748b; font-style: italic; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>🍅 Mi Espacio de Trabajo</h1>
        <button id="btnLogout">Cerrar sesión</button>
    </header>

    <div class="container">
        <section class="card pomodoro-card">
            <h2>⏱️ Temporizador Pomodoro</h2>
            <div id="timer">25:00</div>
            <button id="btnStart">Iniciar / Pausar</button>
        </section>

        <section class="card">
            <h2>📋 Mis Tareas (Base de Datos)</h2>
            
            <div style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; color: #475569; font-weight: 600;">
                    <span>Progreso de hoy</span>
                    <span id="textoProgreso">0%</span>
                </div>
                <div style="width: 100%; background-color: #e2e8f0; border-radius: 10px; height: 12px; overflow: hidden;">
                    <div id="barraProgreso" style="height: 100%; background-color: #10b981; width: 0%; transition: width 0.5s ease-in-out;"></div>
                </div>
            </div>

            <form id="formTarea" class="formulario-tarea">
                <input type="text" id="titulo" placeholder="¿Qué vas a hacer hoy?" required>
                <button type="submit">Agregar</button>
            </form>
            
            <div id="listaTareas">
                <p>Cargando tareas...</p>
            </div>
        </section>
    </div>

    <!-- NUEVA SECCIÓN: DASHBOARD DE ANALÍTICA -->
    <div class="container" style="margin-top: 30px;">
        <section class="card" style="grid-column: 1 / -1;">
            <h2>📊 Dashboard de Productividad</h2>
            <div style="display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px;">
                <div>
                    <h3 style="font-size: 2rem; color: #2563eb; margin:0;" id="statTotal">0</h3>
                    <p style="color: #64748b; font-size: 0.9rem;">Tareas Totales</p>
                </div>
                <div>
                    <h3 style="font-size: 2rem; color: #10b981; margin:0;" id="statCompletadas">0</h3>
                    <p style="color: #64748b; font-size: 0.9rem;">Completadas</p>
                </div>
                <div>
                    <h3 style="font-size: 2rem; color: #f59e0b; margin:0;" id="statPendientes">0</h3>
                    <p style="color: #64748b; font-size: 0.9rem;">Pendientes</p>
                </div>
            </div>
            <div style="width: 100%; max-width: 600px; margin: 0 auto;">
                <canvas id="graficoTareas"></canvas>
            </div>
        </section>
    </div>

    <!-- Cargar Chart.js y luego tu script -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/tareas.js"></script>
</body>
</html>
