<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h2>Sistema Académico</h2>
            <button id="logoutButton" class="logout">Cerrar sesión</button>
        </div>
    </header>
    <main class="container">
        <div class="card">
            <h1>Mi Perfil</h1>
            <p class="subtitle">Área privada del usuario</p>
            <div class="profile">
                <p><strong>ID:</strong> <span id="userId">Cargando...</span></p>
                <p><strong>Email:</strong> <span id="userEmail">Cargando...</span></p>
            </div>
            <p id="message"></p>
        </div>
    </main>
    <script src="js/perfil.js"></script>
</body>
</html>
